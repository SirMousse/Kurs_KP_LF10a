    CSS QUEST: DER VERLORENE RGB-KRISTALL
=============================================

ACHTUNG, JUNIOR-DEVELOPER!

Der böse Lord Graustufe hat alle Farben

Deine Mission:
Rette die RGB-Kristalle mit CSS Gradients!

---------------------------------------------
LEVEL 1: DER FARB-FAHRSTUHL
---------------------------------------------

Erstelle eine Box mit einem linear-gradient.

Deine Aufgaben:
- Der Verlauf soll von Blau nach Lila gehen.
- Der Verlauf soll nach rechts verlaufen.

Tipp:
linear-gradient(to right, ...)

---------------------------------------------
LEVEL 2: DIE FARB-EXPLOSION
---------------------------------------------

Erstelle eine zweite Box.

Deine Aufgaben:
- Benutze radial-gradient.
- In der Mitte soll Gelb sein.
- Außen soll Orange sein.
- Der Verlauf soll kreisförmig sein.

Tipp:
Das Wort "circle" könnte helfen.

---------------------------------------------
LEVEL 3: DIE RGB-PIZZA
---------------------------------------------

Erstelle eine dritte Box.

Deine Aufgaben:
- Benutze conic-gradient.
- Verwende mindestens vier Farben.
- Erstelle einen bunten Kreisverlauf.

Tipp:
Die Farben drehen sich um einen Mittelpunkt.

---------------------------------------------
BONUS-LEVEL: DER CSS-ENDGEGNER
---------------------------------------------

Deine Boxen sehen noch etwas langweilig aus?

Dann verpasse ihnen ein Upgrade!

Deine Aufgaben:
- Runde die Ecken mit border-radius ab.
- Füge einen Schatten mit box-shadow hinzu.
- Erstelle einen Hover-Effekt.

EXTRA BONUS:
Schaffst du es, dass eine Box beim
Darüberfahren mit der Maus größer wird?

Tipp:
transform: scale(1.05);
